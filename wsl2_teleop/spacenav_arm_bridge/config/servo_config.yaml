use_gazebo: false

## Properties of incoming commands
command_in_type: "unitless"  # matches raw spacenav axis values in [-1:1]
scale:
  linear: 0.1
  rotational: 0.4
  joint: 0.1

## Properties of outgoing commands
publish_period: 0.1
low_latency_mode: false

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: false   # arm_trajectory_controller only exposes a position command_interface
publish_joint_accelerations: false

smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# move_group (from real_arm_control.launch.py) is already the primary planning scene owner
is_primary_planning_scene_monitor: false

## MoveIt properties (confirmed from this arm's SRDF/URDF)
move_group_name: pro_arm
planning_frame: pro_arm_base_link

## Other frames
ee_frame_name: pro_arm_ee
robot_link_command_frame: pro_arm_base_link

## Stopping behaviour
incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4

## Singularity / joint limit handling (defaults, tune later if needed)
lower_singularity_threshold: 100.0
hard_stop_singularity_threshold: 200.0
joint_limit_margin: 0.1
leaving_singularity_threshold_multiplier: 2.0

## Topic names
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /arm_trajectory_controller/joint_trajectory

## Collision checking -- keep on, this is real hardware
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
